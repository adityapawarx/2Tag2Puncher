[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagpuncher"
version = "0.1.0"
description = "Reverse-folksonomy tagging: predict concept tags for text with PECOS XR-Linear"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "libpecos>=1.2",
    "numpy>=1.23",
    "orjson>=3.8",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "tqdm>=4.64",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
]
data = [
    "kagglehub>=0.2",
    "matplotlib>=3.6",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.9",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
tagpuncher = "tagpuncher.cli:main"

[tool.setuptools.packages.find]
include = ["tagpuncher*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI dependencies are declared as argument defaults by design.
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
